<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link href="styles.css" rel="stylesheet">

</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left small">
        <p><span class="black">A</span></p>
        <p><span class="black">♠</span></p>
      </div>
      <div class="middle">
        <p><span class="black">♠</span></p>
      </div>
      <div class="right reverse small">
        <p><span class="black">♠</span></p>
        <p><span class="black">A</span></p>
        
      </div>
    </div>
    <div class="card">
       <div class="left small">
        <p><span class="red">2</span></p><p><span class="red">♥</span></p>
       </div>
      <div class="middle">
        <p><span class="red">♥</span></p>
        <p class="reverse"><span class="red  ">♥</span></p>
      </div>
      <div class="right reverse small">
        <p><span class="red">2</span></p><p><span class="red">♥</span></p>
      </div>
    </div>
    <div class="card">
       <div class="left small">
        <p><span class="red">3</span></p><p><span class="red">♦</span></p>
       </div>
      <div class="middle">
        <p><span class="red">♦</span></p>
        <p><span class="red">♦</span></p>
        <p><span class="red">♦</span></p>
        
      </div>
      <div class="right reverse small">
        <p><span class="red">3</span></p><p><span class="red">♦</span></p>
      </div>
    </div>
    <div class="card">
       <div class="left small">
        <p><span class="black">4</span></p><p><span class="black">♣</span></p>
       </div>
      <div class="middle container">
        <p><span class="black">♣</span></p>
        <p><span class="black">♣</span></p>
        <p class="reverse"><span class="black">♣</span></p>
        <p class="reverse"><span class="black">♣</span></p>
        
      </div>
      <div class="right reverse small">
        <p><span class="black">4</span></p><p><span class="black">♣</span></p>
      </div>
    </div>
  </main>

</body>

</html>
