        <h2>Our Contact Form</h2>
        <form action="httpform" method="get">
            <fieldset>
                <legend>Send Us A Message</legend>
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="your name" required autocomplete autofocus="on">
                </p>
                <p>
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="user@gmail.com" required >
                </p>
                <label for="message">Your message:</label>
                <textarea cols="50" rows="10" id="message" placeholder="Type your message here"></textarea>
            </fieldset>
            <button type="submit">Send</button>
            <button type="reset">Reset</button>
            
        </form>
